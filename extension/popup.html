<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SubSnap</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Heebo', sans-serif;
    }
    body {
      width: 360px;
      background-color: #ffffff;
      color: #0f172a;
      padding: 16px;
      border-radius: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #f1f5f9;
    }
    .logo {
      font-size: 17px;
      font-weight: 900;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .logo span {
      color: #059669;
    }
    .badge {
      font-size: 10px;
      background: #ecfdf5;
      color: #059669;
      border: 1px solid #a7f3d0;
      padding: 3px 8px;
      border-radius: 999px;
      font-weight: 700;
    }
    .search-box {
      position: relative;
      margin-bottom: 10px;
    }
    input {
      width: 100%;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      color: #0f172a;
      padding: 10px 12px 10px 36px;
      border-radius: 12px;
      font-size: 13px;
      outline: none;
      transition: all 0.2s;
    }
    input:focus {
      border-color: #059669;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.1);
    }
    .clear-btn {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 12px;
      display: none;
    }
    .tags-container {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 14px;
    }
    .tag {
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      color: #334155;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
      font-weight: 500;
    }
    .tag:hover {
      background: #ecfdf5;
      border-color: #059669;
      color: #059669;
    }
    .result-card {
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      display: none;
    }
    .result-title {
      font-size: 14px;
      font-weight: 800;
      color: #065f46;
      margin-bottom: 3px;
    }
    .result-notes {
      font-size: 11px;
      color: #047857;
      margin-bottom: 10px;
    }
    .btn-cancel {
      width: 100%;
      background: #059669;
      color: #ffffff;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      padding: 9px;
      font-size: 12px;
      cursor: pointer;
      transition: background-color 0.15s, transform 0.1s;
    }
    .btn-cancel:hover {
      background: #047857;
      transform: scale(1.01);
    }
    .btn-cancel:active {
      transform: scale(0.98);
    }
    .footer-link {
      display: block;
      text-align: center;
      font-size: 11px;
      color: #64748b;
      text-decoration: none;
      padding-top: 8px;
      border-top: 1px solid #f1f5f9;
    }
    .footer-link span {
      color: #059669;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo"><span>⚡</span> SubSnap</div>
    <div class="badge">ביטול בלחיצה אחת</div>
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="איזה מנוי תרצה לבטל? (גרוק, נטפליקס...)" autofocus />
    <button class="clear-btn" id="clearBtn">✕</button>
  </div>

  <div class="tags-container" id="tagsContainer">
    <div class="tag" data-service="Grok / X Premium">גרוק / X</div>
    <div class="tag" data-service="Netflix">נטפליקס</div>
    <div class="tag" data-service="Spotify">ספוטיפיי</div>
    <div class="tag" data-service="Adobe">אדובי</div>
    <div class="tag" data-service="ChatGPT Plus">ChatGPT</div>
    <div class="tag" data-service="Canva">קנבה</div>
    <div class="tag" data-service="Amazon Prime">אמזון פריים</div>
  </div>

  <div class="result-card" id="resultCard">
    <div class="result-title" id="serviceName">Grok / X Premium</div>
    <div class="result-notes" id="serviceNotes">ביטול ישיר בהגדרות החשבון</div>
    <button class="btn-cancel" id="btnCancel">בטל מנוי זה עכשיו ➔</button>
  </div>

  <a href="https://www.subsnap.net/app" target="_blank" class="footer-link">
    רוצה לסרוק תדפיס אשראי מלא? <span>פתח את האתר ↗</span>
  </a>

  <script src="popup.js"></script>
</body>
</html>
